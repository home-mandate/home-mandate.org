# Publishes the site after a merge to main (the only workflow that runs after a merge).
#
# Job "build" has no write or signing permissions: install, test and build run
# there, so a compromised dependency never sees an OIDC or package token.
# Job "publish" only packs build/ into the image and:
#   1. checks that this commit is still the head of main (a re-run of an old run
#      must not sign and roll the site back)
#   2. pushes the image by commit tag only (sha-<commit>)
#   3. signs the pushed digest with cosign keyless (GitHub OIDC, no key in the repo)
#   4. records build provenance
#   5. only then points the tag "main" at that digest
#
# The server pulls "main" every 15 minutes, resolves its digest, and deploys it only if the
# signature was made by this workflow file, in this repository, on refs/heads/main, for a
# push, and the commit in the certificate equals the image's revision label.
# Never add pull_request_target or workflow_dispatch triggers to this file.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/home-mandate/home-mandate.org
  SITE_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: build/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Build image, sign, publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Still the head of main?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "${head}" != "${SITE_COMMIT}" ]; then
            echo "main is at ${head}, this run is for ${SITE_COMMIT} - not publishing an older commit." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            Dockerfile
            .dockerignore
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: build/
      - name: Build output belongs to this commit
        run: test "$(jq -r .commit build/version.json)" = "${SITE_COMMIT}"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (commit tag only)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: REVISION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: Move tag main to the signed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          crane tag "${IMAGE}@${DIGEST}" main
          test "$(crane digest "${IMAGE}:main")" = "${DIGEST}"
          echo "Published ${IMAGE}@${DIGEST} as main (commit ${SITE_COMMIT})" >> "$GITHUB_STEP_SUMMARY"
