# Integration stage: build, E2E with Playwright and the container image, for every push
# into a pull request against main and manual runs. Never on a plain branch push and never
# after the merge (see ci.yml); publishing happens only in deploy.yml.
name: Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Trivy fails on HIGH or CRITICAL vulnerabilities that already have a fix. Pinned by
# digest (signature checked), never through the Trivy actions or a moving tag.
env:
  TRIVY: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, E2E, image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Image builds and serves the site
        run: |
          docker build --build-arg REVISION="$SITE_COMMIT" -t site:test .
          docker run -d --name site -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges site:test
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          test "$(curl -fsS http://127.0.0.1:8080/version.json | jq -r .commit)" = "$SITE_COMMIT"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' site:test)" = "$SITE_COMMIT"
          docker rm -f site
      - name: No fixable vulnerabilities in the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress site:test
