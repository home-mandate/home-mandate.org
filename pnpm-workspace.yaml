# Supply-chain hardening, same rules as the other Home-Mandate projects.
# Only versions published at least 7 days ago are installed.
minimumReleaseAge: 10080
# Our own packages come from our own release workflow (trusted publishing with provenance);
# the delay protects against third-party packages only.
minimumReleaseAgeExclude:
  - "@home-mandate/*"
# Dependency install scripts never run; fail instead of silently skipping one.
strictDepBuilds: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# No git or tarball URLs anywhere in the dependency tree.
blockExoticSubdeps: true
saveExact: true
# Security fixes for transitive dependencies (remove once the parents require them):
# source-map-js < 1.2.2: GHSA-68fv-2mgg-jv7q (lint and test tooling only).
overrides:
  source-map-js: 1.2.2
# Advisories that do not apply here (re-check when the parent updates):
# minimatch < 11.0.1: GHSA-g3hv-75wg-m249, moderate: denial of service via globparts
# amplification in crafted patterns. Only eslint, @eslint/config-array and
# @typescript-eslint/typescript-estree use it, at lint time, with the patterns of our own
# ESLint config; no untrusted input reaches it. The fix exists only in 11.x, which the
# parents do not accept yet (they require ^10); remove once they require >= 11.0.1.
# picomatch <= 4.0.7: GHSA-fc5q-39xc-vjpf, high: denial of service through a crafted glob
# pattern (repeated extglobs such as +(*)). Only vite, vitest, tinyglobby, fdir and unplugin
# use it, at build and test time, with the patterns of our own configuration; no untrusted
# pattern reaches it, and it is not part of what we ship. No fixed version exists yet;
# remove once one is published.
auditConfig:
  ignoreGhsas:
    - GHSA-g3hv-75wg-m249
    - GHSA-fc5q-39xc-vjpf
