# Supply-chain hardening, same rules as the other mandate-spec and Home-Mandate projects.
# Only versions published at least 7 days ago are installed.
minimumReleaseAge: 10080
# Dependency install scripts never run; fail instead of silently skipping one.
strictDepBuilds: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# No git or tarball URLs anywhere in the dependency tree.
blockExoticSubdeps: true
saveExact: true
# Security fixes for transitive dependencies (remove once the parents require them):
# source-map-js < 1.2.2: GHSA-68fv-2mgg-jv7q (lint and test tooling only).
# cookie < 0.7.0: GHSA-pxg6-pf52-xh8x (SvelteKit; the prerendered site sets no cookies).
overrides:
  source-map-js: 1.2.2
  cookie: 0.7.2
